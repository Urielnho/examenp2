# =============================================================
#  Nginx – Configuración equipo_02
#  Servidor: 2.25.174.243
#  Ruta pública: http://2.25.174.243/equipo_02/
# =============================================================
#
#  INSTRUCCIONES DE DESPLIEGUE:
#  1. Sube este archivo al servidor:
#       scp nginx_equipo_02.conf equipo_02@2.25.174.243:/home/equipo_02/
#  2. Pídele al administrador que lo incluya en /etc/nginx/conf.d/
#     o que añada la directiva: include /home/equipo_02/nginx_equipo_02.conf;
#     dentro del bloque server { } principal.
# =============================================================

# ------------------------------------------------------------------
# 1. PÁGINA 404 PERSONALIZADA
#    Captura el error 404 y sirve nuestra propia página HTML en lugar
#    de la pantalla gris predeterminada de Nginx.
# ------------------------------------------------------------------
error_page 404 /equipo_02/404.html;

location = /equipo_02/404.html {
    root /home/equipo_02/public;
    internal;
}


# ------------------------------------------------------------------
# 2. MITIGACIÓN DE FUGAS DE INFORMACIÓN
#    Bloquea el acceso a .env, .git y .bak en TODO el servidor.
#    Devuelve 404 (no 403) para no revelar que el archivo existe.
# ------------------------------------------------------------------
location ~* \.(env|git|bak)$ {
    deny all;
    return 404;
}


# ------------------------------------------------------------------
# 3. RESTRICCIÓN DE ACCESO DINÁMICO – ruta sensible /admin
#    Solo permiten acceso:
#      • Tu IP local / subred interna  →  reemplaza TU_IP_INTERNA
#      • Una IP externa de confianza   →  reemplaza IP_EXTERNA
#    Cualquier otro origen recibe 403 Forbidden.
# ------------------------------------------------------------------
location /equipo_02/admin {
    allow 189.222.134.112;  # IP equipo_02 (Uriel)
    allow 177.238.195.227;  # IP externa (compañero)
    deny  all;

    # Sirve el SPA normalmente para las IPs permitidas
    root  /home/equipo_02/public;
    try_files $uri $uri/ /equipo_02/index.html;
}


# ------------------------------------------------------------------
# 4. REDIRECCIÓN PERMANENTE (301)
#    Migración de ruta: /equipo_02/inicio  →  /equipo_02/
#    Útil cuando se cambia la estructura de URLs para no perder
#    tráfico ni referencias externas a la ruta anterior.
# ------------------------------------------------------------------
location = /equipo_02/inicio {
    return 301 /equipo_02/;
}


# ------------------------------------------------------------------
# 5. PROXY AL BACKEND (API REST – Express en puerto 3026)
#    Redirige todas las peticiones /equipo_02/api/ al backend Node.js.
#    Sin esto, Nginx busca un archivo físico y devuelve 404.
# ------------------------------------------------------------------
location /equipo_02/api/ {
    proxy_pass         http://localhost:3026/equipo_02/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
}


# ------------------------------------------------------------------
# 6. BLOQUE PRINCIPAL DEL SPA (React / Vite)
#    Todas las rutas internas del frontend se resuelven a index.html.
# ------------------------------------------------------------------
location /equipo_02/ {
    root  /home/equipo_02/public;
    index index.html;
    try_files $uri $uri/ /equipo_02/index.html;
}
